# Push a tag like v0.1.0 to release: binaries and checksums on the GitHub
# release, the Homebrew formula in Formula/, and the npm package `webnak`
# (when the NPM_TOKEN secret is set).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: go test ./...
      - name: Build
        run: scripts/build.sh
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "webnak $VERSION" --generate-notes
      - name: Homebrew formula
        run: |
          scripts/formula.sh
          git config user.name "webnak-release"
          git config user.email "release@webnak.dev"
          git add Formula/webnak.rb
          git commit -m "Homebrew formula for v$VERSION"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance
