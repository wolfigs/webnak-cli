name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o webnak-ci .
      - name: Versions agree (npm package, plugin, MCP pin)
        shell: bash
        run: |
          v=$(python3 -c "import json;print(json.load(open('npm/package.json'))['version'])")
          python3 -c "import json,sys;v='$v';p=json.load(open('.claude-plugin/plugin.json'))['version'];m=json.load(open('.mcp.json'))['webnak']['args'];assert p==v,('plugin.json',p,v);assert f'@wolfigs/webnak-cli@{v}' in m,('mcp pin',m,v)"
